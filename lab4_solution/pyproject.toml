[project]
name = "asistente-compras"
version = "0.1.0"
description = "Lab 4 MCD8016: asistente de compras por voz en español (ASR + RAG + agente con herramientas + TTS con clonación) sobre Amazon ESCI."
readme = "README.md"
authors = [{ name = "Carlos Irazabal Cuadros" }]
# Colab usa Python 3.12; mantenemos 3.11+ para no atarnos a una versión exacta.
requires-python = ">=3.11"

# Núcleo: lo que necesita cualquier etapa (datos, tienda, métricas). Sin GPU.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Recuperación: BM25 (línea base léxica) + embeddings densos + re-ranker.
rag = [
    "bm25s>=0.2",
    "PyStemmer>=2.2",
    "sentence-transformers>=3.0",
    "scipy>=1.11",
]
# LLM del agente en Colab (transformers + cuantización 4-bit; bitsandbytes solo en Linux/CUDA).
llm = [
    "transformers>=5.22",  # la misma serie validada en la Mac (Qwen3.5 + coqui-tts)
    "accelerate>=1.0",
    "bitsandbytes>=0.44; sys_platform == 'linux'",
    # Kernels de la atención lineal de Qwen3.5 (sin ellos corre una versión mucho más lenta).
    "flash-linear-attention>=0.3; sys_platform == 'linux'",
]
# Voz: ASR, TTS con clonación y métricas de voz.
voz = [
    "faster-whisper>=1.1",
    "coqui-tts[codec]>=0.24",
    "speechbrain>=1.0",
    "jiwer>=3.0",
    "soundfile>=0.12",
    "num2words>=0.5.13",
    "text2num>=2.5",  # palabras → dígitos en español (errores del ASR en cantidades)
    "six>=1.16",  # coqui-tts lo importa pero no lo declara
]
# Solo para desarrollo en la Mac: LLM vía Ollama y Whisper en Apple Silicon.
mac = [
    "ollama>=0.4; sys_platform == 'darwin'",
    "mlx-whisper>=0.4; sys_platform == 'darwin'",
    "sounddevice>=0.5; sys_platform == 'darwin'",
]

[project.scripts]
lab4-preparar-datos = "asistente_compras.data:main"
lab4-conversar = "asistente_compras.cli:main"
lab4-grabar = "asistente_compras.cli:grabar_escenarios"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.7",
    "ipykernel>=6.29",
    "nbconvert>=7.17.2",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
