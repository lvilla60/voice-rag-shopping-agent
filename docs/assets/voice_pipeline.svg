<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="376" viewBox="0 0 1060 376" role="img" aria-labelledby="title desc">
<title id="title">Voice pipeline</title>
<desc id="desc">Recorded Spanish WAV goes through Whisper, the Qwen tool agent, and XTTS-v2. A reference WAV conditions synthesis. Offline metrics use ASR word error rate, re-transcription word error rate, ECAPA cosine similarity and latency timers.</desc>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1060" height="376" rx="0" fill="#FFFFFF"/>
<rect x="45" y="25" width="42" height="4" rx="2" fill="#087C79"/>
<text x="45" y="61" font-size="30" fill="#132842" text-anchor="start" font-weight="700">Voice pipeline</text>
<text x="46" y="89" font-size="16" fill="#425871" text-anchor="start" font-weight="400">Latency starts after recording ends and stops when synthesized audio is ready.</text>
<rect x="45" y="122" width="192" height="80" rx="10" fill="#F2F6FA" stroke="#CCD9E3" stroke-width="1.25"/>
<text x="59" y="151" font-size="17" fill="#132842" text-anchor="start" font-weight="700">Recorded WAV</text>
<text x="59" y="173" font-size="14" fill="#425871" text-anchor="start" font-weight="400">Spanish user input</text>
<rect x="283" y="122" width="192" height="80" rx="10" fill="#E8F1FA" stroke="#CCD9E3" stroke-width="1.25"/>
<text x="297" y="151" font-size="17" fill="#2868A1" text-anchor="start" font-weight="700">Whisper ASR</text>
<text x="297" y="173" font-size="14" fill="#425871" text-anchor="start" font-weight="400">Recognized text</text>
<rect x="521" y="122" width="192" height="80" rx="10" fill="#E8F5F3" stroke="#CCD9E3" stroke-width="1.25"/>
<text x="535" y="151" font-size="17" fill="#087C79" text-anchor="start" font-weight="700">Qwen agent</text>
<text x="535" y="173" font-size="14" fill="#425871" text-anchor="start" font-weight="400">Tools and final reply</text>
<rect x="759" y="122" width="256" height="80" rx="10" fill="#E8F5F3" stroke="#CCD9E3" stroke-width="1.25"/>
<text x="773" y="151" font-size="17" fill="#087C79" text-anchor="start" font-weight="700">XTTS-v2 synthesis</text>
<text x="773" y="173" font-size="14" fill="#425871" text-anchor="start" font-weight="400">Ready-to-play audio</text>
<polyline points="237,164 279,164" fill="none" stroke="#2868A1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="283,164 274,160 274,168" fill="#2868A1"/>
<polyline points="475,164 517,164" fill="none" stroke="#2868A1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="521,164 512,160 512,168" fill="#2868A1"/>
<polyline points="713,164 755,164" fill="none" stroke="#2868A1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="759,164 750,160 750,168" fill="#2868A1"/>
<rect x="759" y="254" width="256" height="76" rx="10" fill="#F2F6FA" stroke="#CCD9E3" stroke-width="1.25"/>
<text x="773" y="283" font-size="17" fill="#132842" text-anchor="start" font-weight="700">Reference WAV</text>
<text x="773" y="305" font-size="14" fill="#425871" text-anchor="start" font-weight="400">Authorized voice conditioning</text>
<polyline points="887,254 887,206" fill="none" stroke="#087C79" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="887,202 883,211 891,211" fill="#087C79"/>
<rect x="45" y="254" width="638" height="76" rx="10" fill="#F2F6FA" stroke="#CCD9E3" stroke-width="1.25"/>
<text x="59" y="283" font-size="17" fill="#132842" text-anchor="start" font-weight="700">Offline evaluation</text>
<text x="59" y="305" font-size="14" fill="#425871" text-anchor="start" font-weight="400">Normalized ASR WER · re-transcribed TTS WER · ECAPA cosine · stage latency</text>
</g>
</svg>
