<polygon points="519,184 510,180 510,188" fill="#2868A1"/>
<polyline points="466,260 487,260 487,221 515,221" fill="none" stroke="#2868A1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="519,221 510,217 510,225" fill="#2868A1"/>
<polyline points="663,203 704,203" fill="none" stroke="#087C79" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="708,203 699,199 699,207" fill="#087C79"/>
<polyline points="853,203 891,203" fill="none" stroke="#087C79" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="895,203 886,199 886,207" fill="#087C79"/>
<text x="45" y="346" font-size="16" fill="#425871" text-anchor="start" font-weight="400">Benchmark ranking uses a fixed set of annotated candidates for each query.</text>
