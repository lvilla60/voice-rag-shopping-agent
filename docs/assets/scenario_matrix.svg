<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="477" viewBox="0 0 1060 477" role="img" aria-labelledby="title desc">
<title id="title">Voice versus correct-text outcomes</title>
<desc id="desc">V1, V2 and V5 passed in both conditions. V3, V4 and V6 failed in both conditions. Automatic pass status can miss qualitative compatibility and selection errors.</desc>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1060" height="477" rx="0" fill="#FFFFFF"/>
<rect x="45" y="25" width="42" height="4" rx="2" fill="#087C79"/>
<text x="45" y="61" font-size="30" fill="#132842" text-anchor="start" font-weight="700">Voice versus correct-text outcomes</text>
<text x="46" y="89" font-size="16" fill="#425871" text-anchor="start" font-weight="400">The same six cases were repeated under both input conditions.</text>
<rect x="45" y="113" width="970" height="45" rx="7" fill="#132842"/>
<text x="62" y="141" font-size="15" fill="#FFFFFF" text-anchor="start" font-weight="700">CASE</text>
<text x="148" y="141" font-size="15" fill="#FFFFFF" text-anchor="start" font-weight="700">SCENARIO</text>
<text x="674" y="141" font-size="15" fill="#FFFFFF" text-anchor="start" font-weight="700">RECORDED AUDIO</text>
<text x="851" y="141" font-size="15" fill="#FFFFFF" text-anchor="start" font-weight="700">CORRECT TEXT</text>
<rect x="45" y="161" width="970" height="39" rx="4" fill="#F2F6FA"/>
<text x="64" y="186" font-size="16" fill="#132842" text-anchor="start" font-weight="700">V1</text>
<text x="148" y="186" font-size="16" fill="#132842" text-anchor="start" font-weight="400">Complete purchase</text>
<rect x="699" y="167" width="83" height="27" rx="5" fill="#E8F5F3"/>
<text x="740.5" y="186" font-size="15" fill="#087C79" text-anchor="middle" font-weight="700">Pass</text>
<rect x="881" y="167" width="83" height="27" rx="5" fill="#E8F5F3"/>
<text x="922.5" y="186" font-size="15" fill="#087C79" text-anchor="middle" font-weight="700">Pass</text>
<rect x="45" y="203" width="970" height="39" rx="4" fill="#FFFFFF"/>
<text x="64" y="228" font-size="16" fill="#132842" text-anchor="start" font-weight="700">V2</text>
<text x="148" y="228" font-size="16" fill="#132842" text-anchor="start" font-weight="400">Ambiguous request</text>
<rect x="699" y="209" width="83" height="27" rx="5" fill="#E8F5F3"/>
<text x="740.5" y="228" font-size="15" fill="#087C79" text-anchor="middle" font-weight="700">Pass</text>
<rect x="881" y="209" width="83" height="27" rx="5" fill="#E8F5F3"/>
<text x="922.5" y="228" font-size="15" fill="#087C79" text-anchor="middle" font-weight="700">Pass</text>
<rect x="45" y="245" width="970" height="39" rx="4" fill="#F2F6FA"/>
<text x="64" y="270" font-size="16" fill="#132842" text-anchor="start" font-weight="700">V3</text>
<text x="148" y="270" font-size="16" fill="#132842" text-anchor="start" font-weight="400">Quantity change</text>
<rect x="699" y="251" width="83" height="27" rx="5" fill="#FCF0E2"/>
<text x="740.5" y="270" font-size="15" fill="#A05825" text-anchor="middle" font-weight="700">Fail</text>
<rect x="881" y="251" width="83" height="27" rx="5" fill="#FCF0E2"/>
<text x="922.5" y="270" font-size="15" fill="#A05825" text-anchor="middle" font-weight="700">Fail</text>
<rect x="45" y="287" width="970" height="39" rx="4" fill="#FFFFFF"/>
<text x="64" y="312" font-size="16" fill="#132842" text-anchor="start" font-weight="700">V4</text>
<text x="148" y="312" font-size="16" fill="#132842" text-anchor="start" font-weight="400">Out-of-stock recovery</text>
<rect x="699" y="293" width="83" height="27" rx="5" fill="#FCF0E2"/>
<text x="740.5" y="312" font-size="15" fill="#A05825" text-anchor="middle" font-weight="700">Fail</text>
<rect x="881" y="293" width="83" height="27" rx="5" fill="#FCF0E2"/>
<text x="922.5" y="312" font-size="15" fill="#A05825" text-anchor="middle" font-weight="700">Fail</text>
<rect x="45" y="329" width="970" height="39" rx="4" fill="#F2F6FA"/>
<text x="64" y="354" font-size="16" fill="#132842" text-anchor="start" font-weight="700">V5</text>
<text x="148" y="354" font-size="16" fill="#132842" text-anchor="start" font-weight="400">User correction</text>
<rect x="699" y="335" width="83" height="27" rx="5" fill="#E8F5F3"/>
<text x="740.5" y="354" font-size="15" fill="#087C79" text-anchor="middle" font-weight="700">Pass</text>
<rect x="881" y="335" width="83" height="27" rx="5" fill="#E8F5F3"/>
<text x="922.5" y="354" font-size="15" fill="#087C79" text-anchor="middle" font-weight="700">Pass</text>
<rect x="45" y="371" width="970" height="39" rx="4" fill="#FFFFFF"/>
<text x="64" y="396" font-size="16" fill="#132842" text-anchor="start" font-weight="700">V6</text>
<text x="148" y="396" font-size="16" fill="#132842" text-anchor="start" font-weight="400">Stock change and repeat confirmation</text>
<rect x="699" y="377" width="83" height="27" rx="5" fill="#FCF0E2"/>
<text x="740.5" y="396" font-size="15" fill="#A05825" text-anchor="middle" font-weight="700">Fail</text>
<rect x="881" y="377" width="83" height="27" rx="5" fill="#FCF0E2"/>
<text x="922.5" y="396" font-size="15" fill="#A05825" text-anchor="middle" font-weight="700">Fail</text>
<text x="45" y="443" font-size="15" fill="#425871" text-anchor="start" font-weight="400">3/6 automatic passes per condition. V2 still exhibited a product compatibility error.</text>
</g>
</svg>
