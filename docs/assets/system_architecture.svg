<text x="251" y="169" font-size="14" fill="#425871" text-anchor="start" font-weight="400">Text transcript</text>
<rect x="454" y="151" width="218" height="100" rx="10" fill="#E8F5F3" stroke="#CCD9E3" stroke-width="1.25"/>
<text x="468" y="180" font-size="17" fill="#087C79" text-anchor="start" font-weight="700">Qwen agent</text>
<text x="468" y="202" font-size="14" fill="#425871" text-anchor="start" font-weight="400">Tool planning and</text>
<text x="468" y="221" font-size="14" fill="#425871" text-anchor="start" font-weight="400">response validation</text>
<rect x="770" y="151" width="245" height="100" rx="10" fill="#E8F1FA" stroke="#CCD9E3" stroke-width="1.25"/>
<text x="784" y="180" font-size="17" fill="#2868A1" text-anchor="start" font-weight="700">Tool dispatcher</text>
<text x="784" y="202" font-size="14" fill="#425871" text-anchor="start" font-weight="400">Search, state, quote</text>
<text x="784" y="221" font-size="14" fill="#425871" text-anchor="start" font-weight="400">and confirmation</text>
<rect x="454" y="326" width="218" height="77" rx="10" fill="#F2F6FA" stroke="#CCD9E3" stroke-width="1.25"/>
<text x="468" y="355" font-size="17" fill="#132842" text-anchor="start" font-weight="700">Conversation state</text>
<text x="468" y="377" font-size="14" fill="#425871" text-anchor="start" font-weight="400">Budget, cart, refs, quote</text>
<rect x="770" y="291" width="245" height="69" rx="10" fill="#F2F6FA" stroke="#CCD9E3" stroke-width="1.25"/>
<text x="784" y="320" font-size="17" fill="#132842" text-anchor="start" font-weight="700">Hybrid retrieval</text>
<text x="784" y="342" font-size="14" fill="#425871" text-anchor="start" font-weight="400">BM25, E5, RRF and BGE</text>
<rect x="770" y="397" width="245" height="80" rx="10" fill="#E8F5F3" stroke="#CCD9E3" stroke-width="1.25"/>
<text x="784" y="426" font-size="17" fill="#087C79" text-anchor="start" font-weight="700">SQLite store</text>
<text x="784" y="448" font-size="14" fill="#425871" text-anchor="start" font-weight="400">Current prices, inventory,</text>
<text x="784" y="467" font-size="14" fill="#425871" text-anchor="start" font-weight="400">atomic order validation</text>
<rect x="45" y="327" width="290" height="77" rx="10" fill="#F2F6FA" stroke="#CCD9E3" stroke-width="1.25"/>
<text x="59" y="356" font-size="17" fill="#132842" text-anchor="start" font-weight="700">Assistant reply</text>
<text x="59" y="378" font-size="14" fill="#425871" text-anchor="start" font-weight="400">Display text or synthesize with XTTS-v2</text>
