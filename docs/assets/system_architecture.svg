<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="502" viewBox="0 0 1060 502" role="img" aria-labelledby="title desc">
<title id="title">System architecture</title>
<desc id="desc">Recorded speech goes through Whisper ASR. Text enters directly. The Qwen agent exchanges tool calls and results, keeps conversation state, retrieves catalog products, validates transactions in SQLite and returns text or synthesized speech.</desc>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1060" height="502" rx="0" fill="#FFFFFF"/>
<rect x="45" y="25" width="42" height="4" rx="2" fill="#087C79"/>
<text x="45" y="61" font-size="30" fill="#132842" text-anchor="start" font-weight="700">System architecture</text>
<text x="46" y="89" font-size="16" fill="#425871" text-anchor="start" font-weight="400">Spanish text and speech share a bounded agent and the same simulated store.</text>
<rect x="45" y="118" width="156" height="66" rx="10" fill="#F2F6FA" stroke="#CCD9E3" stroke-width="1.25"/>
<text x="59" y="147" font-size="17" fill="#132842" text-anchor="start" font-weight="700">Recorded speech</text>
<text x="59" y="169" font-size="14" fill="#425871" text-anchor="start" font-weight="400">Spanish audio</text>
<rect x="45" y="216" width="156" height="66" rx="10" fill="#F2F6FA" stroke="#CCD9E3" stroke-width="1.25"/>
<text x="59" y="245" font-size="17" fill="#132842" text-anchor="start" font-weight="700">Typed request</text>
<text x="59" y="267" font-size="14" fill="#425871" text-anchor="start" font-weight="400">Spanish text</text>
